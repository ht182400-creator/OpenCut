$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'rust'

tasks:
  check:
    command: 'cargo check -p ocx-bindings-wasm'
    inputs:
      - 'src/**/*'
      - 'Cargo.toml'
      - '/Cargo.toml'
      - '/Cargo.lock'

  test:
    command: 'cargo test -p ocx-bindings-wasm'
    inputs:
      - 'src/**/*'
      - 'Cargo.toml'
      - '/Cargo.toml'
      - '/Cargo.lock'
