[package]
name = "ocx-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OpenCut Headless CLI：无浏览器的帧渲染与项目检查（W-13 第二批）"

[[bin]]
name = "ocx-cli"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
ocx-domain = { path = "../../local/crates/ocx-domain" }
ocx-render = { path = "../../local/crates/ocx-render" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
