[package]
name = "opencut-desktop"
description = "OpenCut desktop app, built with GPUI"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "opencut-desktop"
path = "src/main.rs"

[dependencies]
gpui = { workspace = true }
# H01 spike：与 GPUI 0.2.2 对齐的 image 版本，用于把 CPU RGBA 帧转成 GPUI 纹理。
image = "0.25.1"
# H01 spike：复用 core 的确定性 CPU 合成帧与 FNV checksum。
ocx-render = { path = "../../local/crates/ocx-render" }
# W-14 项目骨架：读取 v31 项目 JSON 的归一化视图。
ocx-domain = { path = "../../local/crates/ocx-domain" }
# W-14 项目骨架：帧号换算用 tick 常量。
ocx-time = { path = "../../local/crates/ocx-time" }
